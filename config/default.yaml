topics:
  deskewed_cloud_topic: "/ouster/points" # Input (deskewed) point cloud
  dynamic_cloud_topic: "" # Empty uses /dynamic_point_detector/dynamic_points for detector output and tracker input

frame:
  tracking_frame: odom
  sensor_frame: os_sensor

detector:
  debug: true # Publish per-scan timing breakdowns to the ROS log
  publish_static_cloud: false
  tf_timeout: 0.05

  preprocessing:
    minimum_range: 2.0
    maximum_range: 20.0
    remove_ground: false
    ground_height: 0.0 # Ground-plane z in tracking_frame; adjust if odom starts at the UAV/sensor height
    ground_clearance: 0.05

  voxel_map:
    voxel_size: 0.25
    voxels_per_block: 8
    active_radius: 50.0 # Sensor-centered retention radius; keep larger than maximum_range
    garbage_collection_period: 10

  hmm_mos:
    occupancy_sigma: 0.25
    belief_threshold: 0.99
    transition_epsilon: 0.005
    convolution_size: 5
    local_window_size: 5
    global_window_size: 300
    minimum_otsu_threshold: 3.0
    dilation_radius_voxels: 1
    histogram_bins: 100

tracker:
  debug: true # Publish per-scan tracker timing breakdowns to the ROS log

  clustering:
    cluster_tolerance: 1.0
    min_cluster_size: 20
    max_cluster_size: 200
    cluster_bbox_cutoff_size: 2.0

  tracking:
    use_adaptive_kf: true
    adaptive_kf_alpha: 0.90
    adaptive_kf_dt: 0.1
    time_to_delete_old_obstacles: 5.0
    velocity_threshold: 0.8
    acceleration_threshold: 2.0
    max_history_size: 30

  prediction:
    prediction_horizon: 1.0
    prediction_dt: 0.1
    cutoff_length_threshold: 0.1
    degree_for_pwp: 3
    degree_for_poly: 5
    min_observations_for_prediction: 5
    max_obstacle_velocity: 2.0
